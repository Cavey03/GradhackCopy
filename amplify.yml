version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - node -e "if (!process.env.EXPO_PUBLIC_API_URL) { console.error('Missing required Amplify environment variable: EXPO_PUBLIC_API_URL'); process.exit(1); }"
        - npm ci
    build:
      commands:
        - npx expo export --platform web
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
